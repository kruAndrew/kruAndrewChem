<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atom Economy Challenge</title>
<style>
:root{--g:#10b981;--g6:#059669;--b:#3b82f6;--txt:#1f2937;--mut:#4b5563;--line:#d1d5db}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--txt);background:linear-gradient(135deg,#f0fdf4,#eff6ff)}
body{padding:16px;position:relative;overflow-x:hidden}
@media(min-width:768px){body{padding:32px}}
button{font-family:inherit;cursor:pointer;border:none}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg svg{position:absolute;width:32px;height:32px;color:#bbf7d0;opacity:.35;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fall{0%{transform:translateY(-20px);opacity:1}100%{transform:translateY(60px);opacity:0}}
.wrap{max-width:896px;margin:0 auto;position:relative;z-index:1}
.back{display:inline-block;margin:0 0 10px;font-weight:600;font-size:13px;color:var(--mut);text-decoration:none}
.back:hover{color:var(--g6)}
.card{background:#fff;border-radius:16px;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);padding:24px}
@media(min-width:768px){.card{padding:32px}}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.head .l{display:flex;align-items:center;gap:12px}
.head h1{margin:0;font-size:26px}
@media(min-width:768px){.head h1{font-size:30px}}
.ic{width:32px;height:32px;color:var(--g6);flex:none}
.score{text-align:right}
.score small{display:block;font-size:13px;color:var(--mut)}
.score b{font-size:26px;color:var(--g6)}
.streak{font-size:12px;color:#ea580c;font-weight:700}
.prog{margin-bottom:24px}
.prog .row{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut);margin-bottom:8px;gap:8px}
.diff{font-weight:600}.Easy{color:#16a34a}.Medium{color:#ca8a04}.Hard{color:#dc2626}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:34px;height:34px;border-radius:50%;font-weight:700;font-size:14px;background:#e5e7eb;color:#6b7280;border:2px solid transparent}
.dot.ok{background:#dcfce7;color:#166534}
.dot.bad{background:#fee2e2;color:#991b1b}
.dot.cur{border-color:var(--b)}
.dot:disabled{cursor:not-allowed;opacity:.55}
.dot:not(:disabled):hover{filter:brightness(.95)}
.rx{background:linear-gradient(135deg,#f0fdf4,#eff6ff);border-radius:12px;padding:24px;margin-bottom:24px}
.rx h2{margin:0 0 12px;font-size:20px}
.eq{background:#fff;border-radius:8px;padding:16px;margin-bottom:16px}
.eq .f{text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;margin:0 0 16px}
.cols{display:grid;gap:16px}
@media(min-width:768px){.cols{grid-template-columns:1fr 1fr}}
.cols h3{margin:0 0 8px;font-size:16px;color:#374151}
.cols ul{margin:0;padding:0;list-style:none;color:var(--mut);line-height:1.7}
.task{background:#fefce8;border-left:4px solid #facc15;padding:16px;border-radius:4px}
.task p{margin:0}.task p+p{margin-top:4px}
.hintbtn{background:none;color:#2563eb;font-size:14px;padding:0;margin-bottom:16px;display:inline-flex;align-items:center;gap:4px}
.hintbtn:hover{color:#1d4ed8}
.hint{background:#eff6ff;border-left:4px solid #60a5fa;padding:16px;border-radius:4px;margin-bottom:16px;font-size:14px;color:#374151}
label{display:block;font-weight:600;color:#374151;margin-bottom:8px}
.ans{display:flex;gap:12px;margin-bottom:24px}
.ans input{flex:1;min-width:0;padding:12px 16px;border:2px solid var(--line);border-radius:8px;font-size:18px;font-family:inherit}
.ans input:focus{border-color:var(--g);outline:none}
.grad{background:linear-gradient(90deg,var(--g),var(--b));color:#fff;padding:12px 24px;border-radius:8px;font-weight:600;font-size:16px;transition:transform .15s}
.grad:hover{transform:scale(1.04)}.grad:active{transform:scale(.96)}
.fb{border-radius:8px;padding:16px;margin-bottom:16px;border:2px solid;animation:pop .3s ease-out}
.fb.ok{background:#f0fdf4;border-color:var(--g);color:#166534}
.fb.bad{background:#fef2f2;border-color:#ef4444;color:#991b1b}
.fb .m{display:flex;align-items:flex-start;gap:8px;font-weight:600}
.fb .m svg{width:24px;height:24px;flex:none}
.fb .you{margin:8px 0 0 32px;font-size:14px;font-weight:400;color:#374151}
.work{margin:8px 0 0 32px;font-size:14px;color:#374151;font-family:ui-monospace,Menlo,Consolas,monospace}
.nav{display:flex;justify-content:space-between;gap:12px;margin-bottom:24px}
.navbtn{padding:10px 20px;border-radius:8px;font-weight:600;font-size:15px;background:#f3f4f6;color:#374151}
.navbtn:hover:not(:disabled){background:#e5e7eb}
.navbtn:disabled{opacity:.4;cursor:not-allowed}
.navbtn.next{background:linear-gradient(90deg,#9333ea,#db2777);color:#fff}
.navbtn.next:hover:not(:disabled){filter:brightness(.92)}
.tip{background:linear-gradient(90deg,#faf5ff,#fdf2f8);border:2px solid #e9d5ff;border-radius:8px;padding:16px;font-size:14px;color:#374151}
.tip p{margin:0}.tip p+p{margin-top:8px}
.done{text-align:center}
.done .ic{width:96px;height:96px;color:#eab308;margin:0 auto 16px;display:block}
.done h1{font-size:36px;margin:0 0 16px}
.big{background:linear-gradient(90deg,#dcfce7,#dbeafe);border-radius:12px;padding:24px;margin-bottom:24px}
.big p{margin:0}.big .s{font-size:28px;font-weight:700;margin-bottom:8px}.big .a{font-size:20px;color:var(--mut)}
.take{background:#eff6ff;border-radius:8px;padding:24px;margin-bottom:24px;text-align:left}
.take h3{margin:0 0 12px}.take ul{margin:0;padding:0;list-style:none;color:#374151;line-height:1.9}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.confetti i{position:absolute;width:12px;height:12px;border-radius:50%;animation:fall 1s ease-out forwards}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="confetti" id="confetti"></div>
<div class="wrap">
  <a class="back" href="../index.html#simulators">← Back to the Chemistry Hub</a>
  <div class="card" id="app"></div>
</div>

<script>
const ICON = {
  beaker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M6 14h12"/></svg>',
  trend:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>',
  award:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  bad:'<svg viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>',
  redo:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;margin-right:6px"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>'
};

const REACTIONS = [
  {name:"Synthesis of Aspirin", equation:"C₇H₆O₃ + C₄H₆O₃ → C₉H₈O₄ + C₂H₄O₂",
   reactants:["Salicylic acid (138 g/mol)","Acetic anhydride (102 g/mol)"],
   products:["Aspirin (180 g/mol)","Acetic acid (60 g/mol)"],
   desired:"Aspirin", dm:180, tm:240, answer:75, difficulty:"Easy",
   hint:"Atom economy = (mass of desired product / total mass of products) × 100%"},
  {name:"Production of Ethanol", equation:"C₂H₄ + H₂O → C₂H₅OH",
   reactants:["Ethene (28 g/mol)","Water (18 g/mol)"], products:["Ethanol (46 g/mol)"],
   desired:"Ethanol", dm:46, tm:46, answer:100, difficulty:"Easy",
   hint:"All atoms from reactants end up in the product!"},
  {name:"Copper Extraction from Ore", equation:"2CuO + C → 2Cu + CO₂",
   reactants:["Copper oxide","Carbon"], products:["Copper (128 g)","Carbon dioxide (44 g)"],
   desired:"Copper", dm:128, tm:172, answer:74.4, difficulty:"Medium",
   hint:"Consider the total mass of ALL products formed"},
  {name:"Iron Production", equation:"Fe₂O₃ + 3CO → 2Fe + 3CO₂",
   reactants:["Iron(III) oxide (160 g/mol)","Carbon monoxide"], products:["Iron (112 g)","Carbon dioxide (132 g)"],
   desired:"Iron", dm:112, tm:244, answer:45.9, difficulty:"Hard",
   hint:"Low atom economy means lots of waste - common in extraction processes"},
  {name:"Ammonia Synthesis (Haber Process)", equation:"N₂ + 3H₂ → 2NH₃",
   reactants:["Nitrogen (28 g)","Hydrogen, 3H₂ (6 g)"], products:["Ammonia (34 g)"],
   desired:"Ammonia", dm:34, tm:34, answer:100, difficulty:"Easy",
   hint:"An efficient green chemistry process!"}
];
const TOL = 1.0;

let S;
function reset(){ S = {cur:0, done:REACTIONS.map(()=>null), hint:REACTIONS.map(()=>false), draft:REACTIONS.map(()=>""), finished:false}; render(); }

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const score = () => S.done.reduce((a,d)=>a+(d?d.points:0),0);
const attempts = () => S.done.filter(Boolean).length;
function streak(){ // consecutive correct answers ending at the most recently answered question
  let n=0; const order=S.done.map((d,i)=>d&&{...d,i}).filter(Boolean).sort((a,b)=>a.t-b.t);
  for(let k=order.length-1;k>=0&&order[k].correct;k--) n++; return n;
}
// You may open any question already answered, plus the first unanswered one.
const firstOpen = () => { const i=S.done.findIndex(d=>!d); return i<0?REACTIONS.length-1:i; };
const reachable = i => !!S.done[i] || i===firstOpen();

function go(i){ if(i<0||i>=REACTIONS.length||!reachable(i)) return; S.cur=i; S.finished=false; render(); }

function check(){
  const i=S.cur, r=REACTIONS[i], v=parseFloat(S.draft[i]);
  if(isNaN(v)){ S.invalid=true; render(); return; }
  S.invalid=false;
  const correct=Math.abs(v-r.answer)<=TOL;
  S.done[i]={value:v, correct, points: correct?(S.hint[i]?5:10):0, t:Date.now()};
  if(correct) confetti();
  render();
}

function next(){
  if(S.cur<REACTIONS.length-1){ go(S.cur+1); }
  else if(S.done.every(Boolean)){ S.finished=true; render(); }
}

function confetti(){
  const c=document.getElementById("confetti"), cols=['#10b981','#3b82f6','#f59e0b','#ef4444','#8b5cf6'];
  c.innerHTML=Array.from({length:20},(_,i)=>`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;background:${cols[i%5]};animation-delay:${(Math.random()*.5).toFixed(2)}s"></i>`).join("");
  setTimeout(()=>c.innerHTML="",2000);
}

function renderDone(){
  const sc=score(), at=attempts(), pct=at?sc/(at*10)*100:0;
  return `<div class="done">${ICON.award.replace('<svg','<svg class="ic"')}
    <h1>Game Complete!</h1>
    <div class="big"><p class="s">Final Score: ${sc}/${at*10}</p><p class="a">Accuracy: ${pct.toFixed(0)}%</p></div>
    <div class="take"><h3>Key Takeaways:</h3><ul>
      <li>✓ High atom economy (near 100%) means less waste</li>
      <li>✓ Green chemistry aims for reactions with high atom economy</li>
      <li>✓ Industrial processes often have lower atom economy due to byproducts</li>
      <li>✓ Formula: Atom Economy = (Mass of desired product / Total mass of products) × 100%</li></ul></div>
    <div class="btns">
      <button class="navbtn" data-a="review">← Review my answers</button>
      <button class="grad" data-a="reset">${ICON.redo}Play Again</button>
    </div></div>`;
}

function render(){
  const app=document.getElementById("app");
  if(S.finished){ app.innerHTML=renderDone(); return; }
  const i=S.cur, r=REACTIONS[i], d=S.done[i], st=streak(), allDone=S.done.every(Boolean);
  const dots=REACTIONS.map((_,k)=>{
    const dk=S.done[k], cls=["dot", dk?(dk.correct?"ok":"bad"):"", k===i?"cur":""].join(" ");
    return `<button class="${cls}" data-go="${k}" ${reachable(k)?"":"disabled"} aria-label="Question ${k+1}${dk?(dk.correct?" (correct)":" (incorrect)"):""}">${k+1}</button>`;
  }).join("");

  let body="";
  if(!d){
    body += S.hint[i]
      ? `<div class="hint">${esc(r.hint)}</div>`
      : `<button class="hintbtn" data-a="hint">${ICON.trend} Need a hint? (−5 points)</button>`;
    body += `<label for="ans">Your Answer (%)</label>
      <div class="ans"><input id="ans" type="number" step="0.1" placeholder="Enter atom economy..." value="${esc(S.draft[i])}">
      <button class="grad" data-a="check">Check ✨</button></div>`;
    if(S.invalid) body += `<div class="fb bad"><div class="m">${ICON.bad}<span>Please enter a valid number!</span></div></div>`;
  } else {
    const msg = d.correct
      ? `🎉 Awesome! Atom economy = ${r.answer.toFixed(1)}%. +${d.points} points!`
      : `❌ Not quite. The correct answer is ${r.answer.toFixed(1)}%.`;
    body += `<div class="fb ${d.correct?"ok":"bad"}"><div class="m">${d.correct?ICON.ok:ICON.bad}<span>${msg}</span></div>
      <p class="you">Your answer: ${d.value}%${S.hint[i]?" (hint used)":""}</p>
      <p class="work">${r.dm} ÷ ${r.tm} × 100 = ${(r.dm/r.tm*100).toFixed(1)}%</p></div>`;
  }
  const lastQ = i===REACTIONS.length-1;
  const nextLabel = lastQ ? "See Results 🎊" : "Next Reaction →";
  const nextOk = lastQ ? allDone : reachable(i+1);
  body += `<div class="nav"><button class="navbtn" data-a="prev" ${i>0?"":"disabled"}>← Previous</button>
    <button class="navbtn next" data-a="next" ${nextOk?"":"disabled"}>${nextLabel}</button></div>`;

  app.innerHTML = `
    <div class="head"><div class="l">${ICON.beaker.replace('<svg','<svg class="ic"')}<h1>Atom Economy Challenge</h1></div>
      <div class="score"><small>Score</small><b>${score()}</b>${st>1?`<div class="streak">🔥 ${st}x Streak!</div>`:""}</div></div>
    <div class="prog"><div class="row"><span>Reaction ${i+1} of ${REACTIONS.length}</span><span class="diff ${r.difficulty}">${r.difficulty}</span></div>
      <div class="dots">${dots}</div></div>
    <div class="rx"><h2>${esc(r.name)}</h2>
      <div class="eq"><p class="f">${esc(r.equation)}</p>
        <div class="cols"><div><h3>Reactants:</h3><ul>${r.reactants.map(x=>`<li>• ${esc(x)}</li>`).join("")}</ul></div>
        <div><h3>Products:</h3><ul>${r.products.map(x=>`<li>• ${esc(x)}</li>`).join("")}</ul></div></div></div>
      <div class="task"><p><b>🎯 Desired Product:</b> ${esc(r.desired)}</p><p><b>⚡ Task:</b> Calculate the atom economy (%)</p></div></div>
    ${body}
    <div class="tip"><p><b>💡 Pro Tip:</b></p><p>Atom Economy = (Mass of desired product ÷ Total mass of all products) × 100%</p>
      <p>🌱 Higher atom economy = less waste = greener chemistry!</p></div>`;
  const inp=document.getElementById("ans");
  if(inp) inp.focus({preventScroll:true});
}

document.addEventListener("click", e=>{
  const g=e.target.closest("[data-go]"); if(g){ go(+g.dataset.go); return; }
  const b=e.target.closest("[data-a]"); if(!b) return;
  ({hint(){S.hint[S.cur]=true; render();}, check, next,
    prev(){go(S.cur-1);}, reset, review(){go(0);}})[b.dataset.a]();
});
document.addEventListener("input", e=>{ if(e.target.id==="ans") S.draft[S.cur]=e.target.value; });
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.id==="ans") check(); });

// background beakers, placed once so they don't jump around on every click
document.getElementById("bg").innerHTML = Array.from({length:10},()=>
  ICON.beaker.replace('<svg',`<svg style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${(Math.random()*3).toFixed(1)}s;animation-duration:${(3+Math.random()*2).toFixed(1)}s"`)).join("");

reset();
</script>
</body>
</html>
