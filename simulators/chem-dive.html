<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IB Chem Dive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: playful but exam-literate; a daily ritual for DP chemists.
   IDEA: a dive log; every correct answer is a descent, rarer chemistry goes deeper.
   PICTURE: a full-height ocean depth gauge, 0 to 7000 m, with a diver marker that sinks.
   COLOUR and TYPE: deep-sea teal ground, sea-glass support, coral accent; Lexend throughout.
   LAYOUT: game card left, gauge right; below 720px the gauge becomes a bar above the card. */
:root{color-scheme:dark;--bg:#0a3445;--deep:#041820;--card:#0f4a60;--card2:#13586f;--ink:#effafb;--muted:#a9d3d8;--glass:#7fd1c7;--coral:#ff6b57;--line:rgba(255,255,255,.14)}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--deep));min-height:100vh;color:var(--ink);font:16px/1.55 Lexend,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(20px,4vw,48px) max(4vw,16px);display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:clamp(20px,3vw,40px)}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-size:clamp(32px,5vw,48px);line-height:1.05;margin:0;font-weight:700;text-wrap:balance}
.back{display:inline-block;color:var(--glass);text-decoration:none;font-size:14px;margin-bottom:10px}.back:hover{text-decoration:underline}
.sub{color:var(--muted);margin:6px 0 0}
.seg{display:inline-flex;background:var(--deep);border-radius:999px;padding:4px;border:1px solid var(--line)}
.seg button{min-height:40px;padding:0 18px;border:0;border-radius:999px;background:none;color:var(--muted);font:600 15px Lexend,sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--glass);color:#06303b}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,3vw,34px);box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.tag{background:var(--deep);border-radius:8px;padding:2px 10px;color:var(--glass);font-weight:600}
.q{font-size:clamp(22px,3vw,30px);line-height:1.2;font-weight:600;margin:18px 0 22px;text-wrap:balance}
.timer{height:10px;background:var(--deep);border-radius:99px;overflow:hidden;margin-bottom:20px}
.timer i{display:block;height:100%;width:100%;background:var(--glass);transition:width .1s linear}
.timer.low i{background:var(--coral)}
form{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1 1 220px;min-height:52px;font:500 18px Lexend,sans-serif;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:var(--deep);color:var(--ink)}
input:focus{outline:none;border-color:var(--glass)}
.btn{min-height:52px;padding:0 22px;border-radius:14px;border:0;font:600 16px Lexend,sans-serif;cursor:pointer;background:var(--coral);color:#2b0b05}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:focus-visible,.seg button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.msg{min-height:26px;margin-top:12px;color:var(--muted)}
.msg.trap{color:#ffc2b8}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tier{display:inline-block;font-weight:700;font-size:22px;color:var(--glass)}
.tier.zero{color:var(--coral)}
.big{font-size:clamp(40px,7vw,64px);font-weight:700;line-height:1;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;padding:0;list-style:none}
.chips li{background:var(--card2);border-radius:10px;padding:4px 12px;font-size:15px}
.chips li b{color:var(--glass);font-weight:600;margin-left:6px;font-size:13px}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:15px}
td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}
td.n,th.n{text-align:right;white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:18px 0;padding:0;list-style:none}
.legend li{background:var(--deep);border-radius:12px;padding:10px 12px;font-size:14px}
.legend b{display:block;color:var(--glass)}
.note{font-size:13px;color:var(--muted);margin-top:18px}
/* gauge */
.gauge{position:relative;border-radius:22px;overflow:hidden;min-height:560px;background:linear-gradient(180deg,#3fb5c4 0%,#16788f 18%,#0b4660 45%,#052433 75%,#01090d 100%);border:1px solid var(--line)}
.gauge .tick{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.22);font-size:13px;color:rgba(255,255,255,.75);padding:2px 8px}
.gauge .fill{position:absolute;left:0;right:0;top:0;height:0;background:linear-gradient(180deg,rgba(127,209,199,0),rgba(127,209,199,.25));transition:height 1s ease}
.diver{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);transition:top 1s cubic-bezier(.3,1.3,.5,1)}
.diver .read{position:absolute;left:50%;transform:translateX(-50%);top:34px;white-space:nowrap;background:var(--coral);color:#2b0b05;font-weight:700;font-size:13px;border-radius:8px;padding:2px 8px}
@media(prefers-reduced-motion:reduce){.diver,.gauge .fill,.timer i{transition:none}.shake{animation:none}}
@media(max-width:720px){
 .wrap{grid-template-columns:minmax(0,1fr)}
 .gauge{order:-1;grid-row:2;min-height:0;height:64px;background:linear-gradient(90deg,#3fb5c4,#0b4660 45%,#01090d)}
 .gauge .tick{top:0!important;bottom:0;left:auto;right:auto;border-top:0;border-left:1px dashed rgba(255,255,255,.22);padding:4px}
 .gauge .fill{display:none}
 .diver{top:50%!important;transition:left 1s ease}
 .diver .read{top:auto;bottom:-2px;left:26px;transform:none}
 main{grid-row:3}
}
.lb{margin-top:26px;border-top:1px solid var(--line);padding-top:20px}
.lb h2{font-size:22px;margin:0 0 4px}
.lb table{margin:10px 0 0}
.lb tr.me td{background:rgba(127,209,199,.16);font-weight:600}
.lb td.r{width:3em;color:var(--glass);font-weight:700}
.namebox{background:var(--deep);border-radius:16px;padding:16px;margin-top:18px}
.namebox p{margin:0 0 10px}
.linkbtn{background:none;border:0;color:var(--glass);font:inherit;text-decoration:underline;cursor:pointer;padding:0;min-height:0}
</style>
</head>

const norm=s=>{let n=String(s).replace(/[₀-₉⁰-⁹¹²³]/g,c=>sub[c]||c).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"");
 n=n.replace(/sulph/g,"sulf").replace(/aluminum/g,"aluminium").replace(/cesium/g,"caesium").replace(/isation/g,"ization").replace(/ising/g,"izing").replace(/vapour/g,"vapor").replace(/colour/g,"color").replace(/litre/g,"liter").replace(/metre/g,"meter");
 n=n.replace(/[^a-z0-9]/g,"");
 if(n.length>4&&/[^s]s$/.test(n))n=n.slice(0,-1);
 return n};
const idx=new WeakMap();
function index(p){if(idx.has(p))return idx.get(p);const ok=new Map(),tr=new Map();
 p.a.forEach((tier,ti)=>tier.forEach(e=>{const al=e.split("|"),d=al[0];al.forEach(a=>{const k=norm(a);if(k&&!ok.has(k))ok.set(k,{ti,d})})}));
 Object.entries(p.x||{}).forEach(([k,m])=>k.split("|").forEach(a=>{const n=norm(a);if(n&&!ok.has(n))tr.set(n,m)}));
 const r={ok,tr};idx.set(p,r);return r}
function lev(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;let pr=Array.from({length:b.length+1},(_,i)=>i);
 for(let i=1;i<=a.length;i++){const c=[i];let lo=i;for(let j=1;j<=b.length;j++){c[j]=Math.min(pr[j]+1,c[j-1]+1,pr[j-1]+(a[i-1]===b[j-1]?0:1));lo=Math.min(lo,c[j])}if(lo>max)return max+1;pr=c}return pr[b.length]}
function match(p,raw){const n=norm(raw);if(!n)return{k:"empty"};const {ok,tr}=index(p);
 if(ok.has(n))return{k:"ok",...ok.get(n)};if(tr.has(n))return{k:"trap",m:tr.get(n)};
 if(n.length>=5){const max=n.length>=9?2:1;for(const [k,v] of ok)if(k.length>=5&&lev(n,k,max)<=max)return{k:"ok",...v};
  for(const [k,m] of tr)if(k.length>=5&&lev(n,k,max)<=max)return{k:"trap",m}}
 return{k:"miss"}}

// ---------- daily selection ----------
const pad=n=>String(n).padStart(2,"0");
const dkey=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function rngFrom(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
 let a=h>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(seed,lvl){const r=rngFrom(seed+"|"+lvl);const pool=P.filter(p=>lvl==="HL"||!p.hl);
 const S=shuffle(pool.filter(p=>p.t[0]==="S"),r),R=shuffle(pool.filter(p=>p.t[0]==="R"),r);
 const take=(arr,n)=>{const out=[],c={};for(const p of arr){if(out.length>=n)break;if((c[p.t]||0)<2){out.push(p);c[p.t]=(c[p.t]||0)+1}}return out};
 const nS=r()<.5?3:4;return shuffle(take(S,nS).concat(take(R,7-nS)),r)}

// ---------- storage ----------
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let level=store.get("chemdive:level")||"SL";
{const q=new URLSearchParams(location.search).get("level");if(q==="SL"||q==="HL")level=q}
// ---------- leaderboard ----------
const LB=(window.CHEMDIVE_SCORES_URL||"").trim();
const pid=(()=>{let id=store.get("chemdive:id");if(!id){id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));store.set("chemdive:id",id)}return id})();
const getName=()=>store.get("chemdive:name")||"";
async function lbGet(lvl){const r=await fetch(LB+"?level="+lvl+"&limit=10&id="+encodeURIComponent(pid));return r.json()}
async function lbPost(rec,lvl){const r=await fetch(LB,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({id:pid,name:getName(),level:lvl,date:rec.key,points:rec.scores.reduce((a,b)=>a+(b||0),0)})});return r.json()}
function lbRow(x){return `<tr class="${x.me?"me":""}"><td class="r">${Number(x.rank)}</td><td>${esc(x.name)}${x.me?" (you)":""}</td><td class="n">${Number(x.depth).toLocaleString()} m</td><td class="n">${Number(x.dives)}</td></tr>`}
async function showLB(el,lvl){if(!LB||!el)return;el.innerHTML=`<h2>All-time leaderboard · ${lvl}</h2><p class="msg">Loading…</p>`;
 try{const d=await lbGet(lvl);if(!d.ok)throw 0;
  const rows=d.top.map(lbRow).join("")+(d.me&&!d.top.some(x=>x.me)?lbRow(d.me):"");
  el.innerHTML=`<h2>All-time leaderboard · ${lvl}</h2><p class="msg" style="margin:0">Each diver's deepest single daily dive. ${Number(d.players)} diver${d.players===1?"":"s"} so far.</p>`+
  (rows?`<table><thead><tr><th>#</th><th>Diver</th><th class="n">Deepest</th><th class="n">Dives</th></tr></thead><tbody>${rows}</tbody></table>`:`<p>No dives posted yet. Be the first.</p>`)+
  (getName()?`<p class="note">Posting as <b>${esc(getName())}</b>. <button class="linkbtn" id="rn">Change name</button></p>`:"");
  const rn=el.querySelector("#rn");if(rn)rn.onclick=()=>{store.set("chemdive:name","");if(G&&G.done&&!G.practice)results();else home()}}
 catch(e){el.innerHTML=`<h2>All-time leaderboard</h2><p class="msg">Couldn't load the leaderboard right now.</p>`}}
async function post(){const k="chemdive:"+G.key+":"+level,rec=store.get(k);if(!LB||!rec)return;if(rec.posted||!getName())return showLB(document.getElementById("lb"),level);
 const st=document.getElementById("post");if(st)st.textContent="Posting your dive…";
 try{const d=await lbPost(rec,level);if(!d.ok)throw new Error(d.error||"");rec.posted=true;store.set(k,rec);const f=document.getElementById("nf");if(f){f.outerHTML='<p class="msg" id="post"></p>'}const s2=document.getElementById("post");if(s2)s2.textContent="Posted to the leaderboard as "+getName()+"."}
 catch(e){if(st)st.textContent="Couldn't post your dive"+(e.message?": "+e.message:"")+". It will try again next time you open this page."}
 showLB(document.getElementById("lb"),level)}

// ---------- state & UI ----------
const app=document.getElementById("app"),diver=document.getElementById("diver"),read=document.getElementById("read"),fill=document.getElementById("fill"),gauge=document.getElementById("gauge");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let G=null,timer=null;
const depthOf=pts=>pts*10;
function setDepth(m){const f=Math.min(m/MAXD,1);const narrow=matchMedia("(max-width:720px)").matches;
 if(narrow){diver.style.left=(6+f*80)+"%";diver.style.top="50%"}else{diver.style.left="50%";diver.style.top=(4+f*90)+"%";fill.style.height=(4+f*90)+"%"}
 read.textContent=m.toLocaleString()+" m"}
function ticks(){[0,1000,2000,3000,4000,5000,6000,7000].forEach(m=>{const t=document.createElement("div");t.className="tick";const f=m/MAXD;t.style.top=(4+f*90)+"%";t.style.left=matchMedia("(max-width:720px)").matches?(6+f*80)+"%":"";t.textContent=m?m/1000+"k":"0";gauge.appendChild(t)})}
function redrawTicks(){gauge.querySelectorAll(".tick").forEach(t=>t.remove());ticks();setDepth(G?depthOf(G.scores.reduce((a,b)=>a+(b||0),0)):0)}
addEventListener("resize",redrawTicks);

function setLevel(l){level=l;store.set("chemdive:level",l);document.getElementById("lvSL").setAttribute("aria-pressed",l==="SL");document.getElementById("lvHL").setAttribute("aria-pressed",l==="HL");if(!G||G.done||G.i===-1)home()}
document.getElementById("lvSL").onclick=()=>{if(!G||G.i<0||G.done)setLevel("SL")};
document.getElementById("lvHL").onclick=()=>{if(!G||G.i<0||G.done)setLevel("HL")};

const fmtDate=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})};

function home(){clearInterval(timer);const k=dkey();const saved=store.get("chemdive:"+k+":"+level);
 document.getElementById("dateline").textContent=fmtDate(k)+" · "+level+" dive";
 if(saved){G={...saved,list:pick(k,level),done:true,practice:false};return results()}
 G=null;setDepth(0);
 app.innerHTML=`<div class="meta"><span>Today's dive</span><span class="tag">${level}</span></div>
 <p class="q">Seven chemistry prompts from across the DP guide. Everyone in ${level} gets the same seven today.</p>
 <p>Type any correct answer. Obvious ones keep you near the surface; rarer correct chemistry takes you deeper. If an answer is rejected you can try again until the 25 seconds run out.</p>
 <ul class="legend">${TIERS.map(t=>`<li><b>${t.n}</b>${t.p} pts · ${(t.p*10).toLocaleString()} m</li>`).join("")}</ul>
 <div class="row"><button class="btn" id="go">Start today's dive</button><button class="btn ghost" id="pr">Practice dive</button></div>
 <p class="note">One scored dive per day per level, saved on this device. A new dive unlocks at midnight.</p><section class="lb" id="lb"></section>`;
 showLB(document.getElementById("lb"),level);
 document.getElementById("go").onclick=()=>start(k,false);document.getElementById("pr").onclick=()=>start("practice-"+Math.random(),true)}

function start(seed,practice){G={key:dkey(),list:pick(seed,level),i:-1,scores:[],answers:[],practice,done:false};next()}

function next(){G.i++;if(G.i>=G.list.length)return finish();const p=G.list[G.i];let left=25,locked=false;
 app.innerHTML=`<div class="meta"><span>Prompt ${G.i+1} of 7</span><span class="tag">${p.t}${p.hl?" · HL":""}</span></div>
 <p class="q">${esc(p.q)}</p><div class="timer" id="tm"><i id="tb"></i></div>
 <form id="f" autocomplete="off"><input id="in" aria-label="Your answer" placeholder="Type an answer…" autocapitalize="off" spellcheck="false"><button class="btn">Dive</button><button type="button" class="btn ghost" id="pass">Pass</button></form>
 <div class="msg" id="msg">${left} seconds</div>`;
 const inp=document.getElementById("in"),msg=document.getElementById("msg"),tb=document.getElementById("tb"),tm=document.getElementById("tm");inp.focus();
 const t0=Date.now();clearInterval(timer);
 timer=setInterval(()=>{const el=(Date.now()-t0)/1000;left=Math.max(0,25-el);tb.style.width=(left/25*100)+"%";tm.classList.toggle("low",left<6);
  if(!msg.dataset.hold)msg.textContent=Math.ceil(left)+" seconds";if(left<=0&&!locked){locked=true;lock(null)}},100);
 document.getElementById("pass").onclick=()=>{if(!locked){locked=true;lock(null)}};
 document.getElementById("f").onsubmit=e=>{e.preventDefault();if(locked)return;const v=inp.value.trim();if(!v)return;const r=match(p,v);
  if(r.k==="ok"){locked=true;lock(r,v)}
  else{inp.classList.remove("shake");void inp.offsetWidth;inp.classList.add("shake");msg.dataset.hold=1;
   msg.className="msg"+(r.k==="trap"?" trap":"");msg.textContent=r.k==="trap"?r.m+" Try another.":"Not in the answer bank. Check spelling or try another.";
   inp.select();setTimeout(()=>{delete msg.dataset.hold;msg.className="msg"},3200)}}}

function lock(r,raw){clearInterval(timer);const p=G.list[G.i];const pts=r?TIERS[r.ti].p:0;G.scores.push(pts);G.answers.push(r?{d:r.d,ti:r.ti}:null);
 const tot=G.scores.reduce((a,b)=>a+b,0);setDepth(depthOf(tot));
 const deeper=[];for(let t=4;t>(r?r.ti:-1)&&deeper.length<6;t--)p.a[t].forEach(e=>{if(deeper.length<6&&(!r||e.split("|")[0]!==r.d))deeper.push({d:e.split("|")[0],ti:t})});
 const others=deeper.length?deeper:p.a.flatMap((tier,ti)=>tier.map(e=>({d:e.split("|")[0],ti}))).filter(o=>o.d!==r.d).slice(0,6);
 app.innerHTML=`<div class="meta"><span>Prompt ${G.i+1} of 7</span><span class="tag">${p.t}</span></div>
 <p class="q">${esc(p.q)}</p>
 ${r?`<p>You said <b>${esc(r.d)}</b></p><span class="tier">${TIERS[r.ti].n} · +${(pts*10).toLocaleString()} m</span>`:`<span class="tier zero">No answer · +0 m</span>`}
 <p style="margin:18px 0 0;color:var(--muted)">${deeper.length?"Deeper answers you could have given":"Other answers"}</p>
 <ul class="chips">${others.map(o=>`<li>${esc(o.d)}<b>${TIERS[o.ti].n}</b></li>`).join("")}</ul>
 <div class="row"><button class="btn" id="nx">${G.i<6?"Next prompt":"Surface and see results"}</button></div>`;
 const b=document.getElementById("nx");b.focus();b.onclick=next}

function finish(){G.done=true;if(!G.practice)store.set("chemdive:"+G.key+":"+level,{key:G.key,scores:G.scores,answers:G.answers});results()}

function shareText(){const tot=G.scores.reduce((a,b)=>a+b,0);return `IB Chem Dive · ${G.key} · ${level}\n${(tot*10).toLocaleString()} m of 7,000 m\n`+G.answers.map((a,i)=>(i+1)+". "+(a?TIERS[a.ti].n:"—")).join("\n")}

function results(){clearInterval(timer);const tot=G.scores.reduce((a,b)=>a+b,0);setDepth(depthOf(tot));
 const best=G.answers.reduce((m,a)=>a&&a.ti>m?a.ti:m,-1);
 app.innerHTML=`<div class="meta"><span>${G.practice?"Practice dive":"Today's dive · "+fmtDate(G.key)}</span><span class="tag">${level}</span></div>
 <div class="big">${(tot*10).toLocaleString()} m</div><p style="margin:0;color:var(--muted)">${tot} of 700 points${best>=0?" · deepest find: "+TIERS[best].n:""}</p>
 <table class="stack"><thead><tr><th>Prompt</th><th>Your answer</th><th>Zone</th><th class="n">Depth</th></tr></thead><tbody>
 ${G.list.map((p,i)=>{const a=G.answers[i];return `<tr><td>${esc(p.q)} <span style="color:var(--muted)">(${p.t})</span></td><td>${a?esc(a.d):"—"}</td><td>${a?TIERS[a.ti].n:"Missed"}</td><td class="n">${((G.scores[i]||0)*10).toLocaleString()} m</td></tr>`}).join("")}
 </tbody></table>
 <div class="row">${G.practice?"":`<button class="btn" id="cp">Copy result</button>`}<button class="btn ${G.practice?"":"ghost"}" id="pr">Practice dive</button>${G.practice?`<button class="btn ghost" id="hm">Back to today</button>`:""}</div>
 <p class="msg" id="cd"></p>
 ${!G.practice&&LB?(getName()?`<p class="msg" id="post"></p>`:`<form class="namebox" id="nf"><p><b>Put this dive on the leaderboard.</b> Choose a display name (2–20 characters). Your teacher can see every name.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="nm" maxlength="20" aria-label="Display name" placeholder="Display name"><button class="btn">Post my dive</button></div><p class="msg" id="post"></p></form>`):""}
 ${G.practice?"":`<section class="lb" id="lb"></section>`}
 <p class="note">Rarity zones reflect how often DP students tend to think of each answer: a teacher's judgement, not live player data. Answers are matched with common spellings, formulae and small typos.</p>`;
 const cp=document.getElementById("cp");if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(shareText());cp.textContent="Copied"}catch(e){cp.textContent="Copy blocked"}};
 document.getElementById("pr").onclick=()=>start("practice-"+Math.random(),true);
 const hm=document.getElementById("hm");if(hm)hm.onclick=home;
 const nf=document.getElementById("nf");if(nf)nf.onsubmit=e=>{e.preventDefault();const v=document.getElementById("nm").value.replace(/\s+/g," ").trim();if(v.length<2){document.getElementById("post").textContent="Use at least 2 characters.";return}store.set("chemdive:name",v.slice(0,20));const k="chemdive:"+G.key+":"+level,rec=store.get(k);if(rec){rec.posted=false;store.set(k,rec)}post()};
 if(!G.practice){if(getName())post();else showLB(document.getElementById("lb"),level)}
 if(!G.practice){const cd=document.getElementById("cd");const tick=()=>{const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const s=Math.max(0,(m-n)/1000|0);cd.textContent="Next dive in "+Math.floor(s/3600)+" h "+pad(Math.floor(s%3600/60))+" min";if(s===0)home()};tick();clearInterval(timer);timer=setInterval(tick,30000)}}

ticks();setLevel(level);
}
</script>
