<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Teacher Tools</title>
<style>
:root{--ink:#1b2433;--muted:#5b6678;--paper:#f4f6f9;--surface:#fff;--line:#dde2ea;--accent:#1f4fa8}
@media (prefers-color-scheme: dark){:root{--ink:#e6eaf1;--muted:#9aa5b6;--paper:#11161e;--surface:#1a212c;--line:#2c3644;--accent:#7ea6f0;color-scheme:dark}}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 20px;display:grid;gap:16px}
h1{font-family:Georgia,serif;margin:0}
p{margin:0;color:var(--muted)}
a.tool{display:block;padding:16px 18px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;background:var(--surface);color:inherit;text-decoration:none}
a.tool:hover{border-color:var(--accent)}
a.tool b{display:block;font-size:18px}
a.tool span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Teacher tools</h1>
  <p>For DP Chemistry staff. This area isn't linked from the student hub.</p>
  <a class="tool" href="ia-feedback/">
    <b>Chemistry IA Feedback</b>
    <span>Upload a student's IA report (PDF) for criterion-by-criterion feedback, a conservative estimated mark out of 24, and highlighted passages to revise.</span>
  </a>
</main>
</body>
</html>
